<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quoridor Online</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Quoridor</h1>

  <section id="menu" class="screen">
    <button id="btn-create">새 게임 만들기</button>
    <div class="join-row">
      <input id="join-code" maxlength="6" placeholder="방 코드 입력">
      <button id="btn-join">코드로 참가</button>
    </div>
    <button id="btn-ai">AI와 대결</button>
    <p id="menu-error" class="error"></p>
  </section>

  <section id="waiting" class="screen hidden">
    <p>방 코드: <span id="waiting-code"></span></p>
    <p>상대를 기다리는 중...</p>
  </section>

  <section id="game" class="screen hidden">
    <div id="hud">
      <span id="turn-indicator"></span>
      <span id="walls-left"></span>
    </div>
    <div id="game-layout">
      <div id="board-wrap"></div>
      <div id="chat-panel">
        <div id="chat-log"></div>
        <div class="chat-input-row">
          <input id="chat-input" maxlength="300" placeholder="메시지 입력">
          <button id="chat-send">전송</button>
        </div>
      </div>
    </div>
    <p id="game-error" class="error"></p>
  </section>

  <div id="result-modal" class="hidden">
    <div class="modal-box">
      <p id="result-text"></p>
      <button id="btn-restart">메뉴로</button>
    </div>
  </div>

  <script src="net.js"></script>
  <script src="board.js"></script>
</body>
</html>
