<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>팩맨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="../">← Game Hub</a>
    <h1>팩맨</h1>
  </header>

  <div id="hud">
    <span>점수 <b id="score">0</b></span>
    <span>최고 <b id="high">0</b></span>
    <span>레벨 <b id="level">1</b></span>
    <span>목숨 <b id="lives"></b></span>
  </div>

  <canvas id="board"></canvas>

  <p class="help">방향키 / WASD: 이동 · Enter: 시작 · P: 일시정지 · 모바일: 화면을 쓸어서 이동</p>

  <script type="module" src="game.js"></script>
