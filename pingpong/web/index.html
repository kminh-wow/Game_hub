<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>탁구</title>
  <link rel="stylesheet" href="style.css?v=1">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js"}}</script>
</head>
<body>
  <main class="game-shell">
  <header>
    <a href="../">← Ddan Jit</a>
    <h1>탁구<span class="title-dot" aria-hidden="true"></span></h1>
  </header>

  <!-- 점수판 -->
  <div id="hud">
    <span class="side"><i id="my-serve" class="serve" title="서브"></i>나 <b id="my-score" class="big">0</b></span>
    <span class="vs">:</span>
    <span class="side"><b id="ai-score" class="big">0</b> AI <i id="ai-serve" class="serve" title="서브"></i></span>
    <span>난이도 <b id="level">중</b></span>
    <span>랠리 <b id="rally">0</b></span>
    <span>최장 <b id="longest">0</b></span>
  </div>

  <!-- 3D 화면과 겹쳐 띄우는 정보 -->
  <div class="board-wrap">
    <canvas id="board" aria-label="탁구대 3D 화면"></canvas>
    <div id="banner" class="banner"></div>
    <div id="panel" class="panel">
      <h2 id="panel-title">탁구</h2>
      <p id="panel-text"></p>
      <div id="levels" class="levels">
        <button type="button" data-level="0">하<small></small></button>
        <button type="button" data-level="1">중<small></small></button>
        <button type="button" data-level="2">상<small></small></button>
      </div>
      <button id="panel-btn" type="button">시작하기</button>
    </div>
  </div>

  <p class="help">마우스·손가락으로 라켓 움직이기 · 공이 올 때 <b>앞으로 휘두르면 드라이브</b>, 높은 공을 세게 치면 스매시, 뒤로 당기면 커트, 가만히 대면 블록 · 옆으로 휘두르면 그쪽으로 · 클릭·스페이스: 서브 · P / Esc: 일시정지 · M: 소리</p>
  </main>

  <script type="module" src="game.js?v=1"></script>
</body>
</html>
