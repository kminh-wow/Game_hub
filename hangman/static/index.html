<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>행맨</title>
  <link rel="stylesheet" href="static/style.css?v=3">
</head>
<body>
  <!-- 로그인 -->
  <section id="screen-login" class="screen">
    <div class="login-card">
      <h1>행맨 <span>Hangman</span></h1>
      <p class="muted">돌아가며 영어 단어를 내고, 차례대로 맞혀 보세요</p>
      <form id="login-form">
        <input id="login-name" maxlength="12" placeholder="닉네임 (최대 12자)" autocomplete="off" required>
        <button type="submit">입장</button>
      </form>
      <p id="login-error" class="error"></p>
      <a class="hub-link" href="../">← 다른 게임 고르기</a>
    </div>
  </section>

  <!-- 로비 -->
  <section id="screen-lobby" class="screen hidden">
    <header class="topbar">
      <a class="hub-link" href="../" title="게임 목록">← Ddan Jit</a>
      <h2>로비</h2>
      <span class="muted">접속: <b id="me-name"></b> · 영어 사전 <span id="word-count"></span>단어</span>
    </header>
    <div class="layout">
      <div class="panel grow">
        <div class="panel-head">
          <h3>방 목록</h3>
          <button id="btn-open-create">방 만들기</button>
        </div>
        <form id="create-form" class="create-form hidden">
          <input id="create-title" maxlength="30" placeholder="방 제목" autocomplete="off">
          <label>인원
            <select id="create-max">
              <option>2</option><option>3</option><option>4</option>
              <option>5</option><option selected>6</option><option>7</option><option>8</option>
            </select>
          </label>
          <button type="submit">만들기</button>
          <button type="button" id="btn-cancel-create" class="ghost">취소</button>
        </form>
        <ul id="room-list" class="room-list"></ul>
      </div>
      <div class="panel side">
        <h3>접속자 <span id="user-count" class="muted"></span></h3>
        <ul id="user-list" class="user-list"></ul>
      </div>
    </div>
    <div class="panel chat">
      <ul id="lobby-chat-log" class="chat-log"></ul>
      <form id="lobby-chat-form" class="chat-form">
        <input id="lobby-chat-input" maxlength="200" placeholder="채팅" autocomplete="off">
        <button type="submit">전송</button>
      </form>
    </div>
  </section>

  <!-- 방 -->
  <section id="screen-room" class="screen hidden">
    <header class="topbar">
      <h2 id="room-title"></h2>
      <span id="room-info" class="muted"></span>
      <button id="btn-leave" class="ghost">나가기</button>
    </header>
    <div class="layout">
      <div class="panel side">
        <h3>참가자 <span class="muted">(들어온 순)</span></h3>
        <ul id="player-list" class="player-list"></ul>
      </div>

      <div class="panel grow">
        <!-- 대기 화면 -->
        <div id="waiting-view">
          <h3>게임 설정</h3>
          <form id="settings-form" class="settings">
            <label>출제 바퀴 수 <input type="number" name="cycles" min="1" max="3"></label>
            <label>목숨 (틀릴 수 있는 횟수) <input type="number" name="lives" min="4" max="10"></label>
            <label>턴 시간(초) <input type="number" name="turn_time" min="10" max="60"></label>
            <label>힌트 공개 (추측 N번 뒤) <input type="number" name="hint_turn" min="1" max="15"></label>
            <label>최대 인원 <input type="number" name="max_players" min="2" max="8"></label>
          </form>
          <p class="muted">들어온 순서대로 한 명씩 출제자가 되고, 나머지가 차례대로 알파벳을 맞혀요.</p>
          <p id="settings-note" class="muted"></p>
          <button id="btn-ready" class="big"></button>
        </div>

        <!-- 게임 화면 -->
        <div id="game-view" class="hidden">
          <div class="game-top">
            <span id="round-info"></span>
            <span id="turn-info"></span>
          </div>

          <div class="word-area">
            <div id="pattern" class="pattern"></div>
            <div id="progress-line" class="progress-line"></div>
            <div id="hint-line" class="hint-line"></div>
            <div id="wrong-line" class="wrong-line"></div>
          </div>

          <!-- 추측하는 사람마다 교수대 하나씩 -->
          <ul id="gallows-list" class="gallows-list"></ul>

          <div class="bar-row"><span>시간</span><div class="bar"><div id="time-bar"></div></div><span id="time-sec"></span></div>
          <p id="game-status" class="game-status"></p>

          <!-- 출제자: 단어 입력 -->
          <form id="setter-form" class="setter-form hidden" autocomplete="off">
            <input name="word" maxlength="15" placeholder="영어 단어 (3~15글자)" required>
            <input name="hint" maxlength="40" placeholder="힌트 (선택, 추측 몇 번 뒤에 공개)">
            <button type="submit">출제</button>
          </form>

          <!-- 추측자: 키보드 -->
          <div id="guess-area">
            <div id="keyboard" class="keyboard"></div>
            <form id="word-guess" class="word-guess" autocomplete="off">
              <input id="word-guess-input" maxlength="15" placeholder="단어 전체를 알 것 같다면 입력">
              <button type="submit">정답 맞히기</button>
            </form>
          </div>
          <p id="watch" class="watch hidden"></p>
        </div>
      </div>
    </div>
    <div class="panel chat">
      <ul id="room-chat-log" class="chat-log"></ul>
      <form id="room-chat-form" class="chat-form">
        <input id="room-chat-input" maxlength="200" placeholder="채팅" autocomplete="off">
        <button type="submit">전송</button>
      </form>
    </div>
  </section>

  <!-- 결과 -->
  <div id="result-modal" class="modal hidden">
    <div class="modal-card">
      <h3>게임 결과</h3>
      <ol id="result-list" class="result-list"></ol>
      <button id="btn-close-result">확인</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="static/app.js?v=3"></script>
</body>
</html>
