<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>길건너기</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js"}}</script>
</head>
<body>
  <main class="game-shell">
  <header>
    <a href="../">← Ddan Jit</a>
    <h1>길건너기<span class="title-dot" aria-hidden="true"></span></h1>
  </header>

  <!-- 3D 화면과 겹쳐 띄우는 정보 -->
  <div class="board-wrap">
    <canvas id="board" aria-label="길건너기 3D 화면"></canvas>
    <div class="score"><b id="score">0</b><span id="best">최고 0</span></div>
    <div id="banner" class="banner"></div>
    <div class="coins"><i aria-hidden="true"></i><b id="coins">0</b></div>
    <div id="panel" class="panel">
      <h2 id="panel-title">길건너기</h2>
      <p id="panel-text"></p>
      <div id="lb" class="panel-lb"></div>
      <button id="panel-btn" type="button">시작하기</button>
    </div>
  </div>

  <p class="help">↑↓←→ / WASD: 한 칸씩 뛰기 · 스페이스: 앞으로 · 모바일: 탭하면 앞으로, 밀면 그 방향 · 가만히 있거나 뒤로 3칸 가면 독수리가 와요</p>
  </main>

  <script src="../common/leaderboard.js?v=2"></script>
  <script type="module" src="game.js?v=7"></script>
</body>
</html>
